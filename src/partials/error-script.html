<script>
/* Datos de contacto: los mismos que el bloque CONFIG de index.html */
var CONFIG = { email: "[EMAIL]" };
(function(){
  /* En github.io el sitio vive en /oidococina/: corrige los enlaces absolutos.
     Si la página la sirve el service worker, toma la base de su alcance. */
  var base = "/";
  if (location.hostname.endsWith(".github.io")) base = "/" + location.pathname.split("/")[1] + "/";
  window.OC_BASE = base;
  document.querySelectorAll('a[href^="/"]').forEach(function(a){ a.setAttribute("href", base + a.getAttribute("href").slice(1)); });
  if (!/^\[.*\]$/.test(CONFIG.email)) document.querySelectorAll('[data-cfg="mailto"]').forEach(function(a){ a.href = "mailto:" + CONFIG.email; });

  /* Idioma: español por defecto; inglés si el visitante lo eligió en la web o llega con ?lang=en */
  var TITLES = { es: document.title, en: document.documentElement.dataset.titleEn };
  function setLang(l){
    document.documentElement.lang = l;
    document.title = TITLES[l];
    document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === l); });
    try { localStorage.setItem("oc-lang", l); } catch(e){}
    try { window.dispatchEvent(new Event("oc:lang")); } catch(e){}
  }
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setLang(b.dataset.lang); }); });
  var saved = null;
  try { saved = localStorage.getItem("oc-lang"); } catch(e){}
  var q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "es") saved = q;
  if (saved === "en") setLang("en");
  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
