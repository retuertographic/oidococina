<style>
:root{
  --bg:#F5EFE4;--bg2:#EDE4D3;--card:#FFFDF8;--ink:#1C1814;--ink2:#2A241E;
  --muted:#4A4238;--muted2:#5E554A;--line:#E3D9C8;--line2:#D8CCB7;
  --accent:#C2410C;--accent-d:#9A3412;--green:#2F5D3A;--amber:#FDBA74;--cream-muted:#D6CBBB;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
a{color:var(--accent-d)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:40px;padding-right:40px}
.hdr{border-bottom:1px solid var(--line);background:rgba(245,239,228,.94);padding-top:env(safe-area-inset-top,0px)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo__mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#FFFDF8;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.logo__txt{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;padding:0 12px;min-height:40px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#FFFDF8}
main{flex:1;display:flex;align-items:center}
.err{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding-top:72px;padding-bottom:88px}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--accent-d);margin-bottom:14px;text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,5.6vw,66px);line-height:1.03;letter-spacing:-.03em}
.lead{font-size:19px;color:var(--muted);max-width:540px;margin-top:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:var(--sans)}
.btn--accent{background:var(--accent);color:#FFFDF8}
.btn--accent:hover{background:var(--accent-d)}
.btn--ghost{border-color:var(--ink);color:var(--ink);background:transparent;font-weight:500}
.btn--ghost:hover{background:var(--ink);color:#FFFDF8}
.links{margin-top:34px;padding-top:22px;border-top:1px solid var(--line2);max-width:540px}
.links p{font-size:14px;color:var(--muted2);font-family:var(--mono);margin-bottom:8px}
.links ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 22px}
.links a{display:inline-flex;align-items:center;min-height:40px;font-weight:500;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line2)}
.links a:hover{color:var(--accent-d);text-decoration-color:currentColor}
.ticket{justify-self:center;width:100%;max-width:340px;background:var(--ink);color:var(--bg);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:13px;box-shadow:0 24px 48px rgba(28,24,20,.18);transform:rotate(2deg)}
.ticket__top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ticket__top strong{font-family:var(--display);font-size:22px}
.ticket__time{font-family:var(--mono);font-size:13px;color:#FCA5A5}
.ticket__meta{font-family:var(--mono);font-size:12px;color:#BFB3A2}
.bar{height:6px;border-radius:999px;background:#3A332B;overflow:hidden}
.bar i{display:block;height:6px;border-radius:999px;background:#F87171}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.ok{color:#86EFAC}.now{color:var(--amber)}.ko{color:#FCA5A5}
.ticket__btn{padding:12px;border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;font-weight:700;font-size:14px}
.status{margin-top:18px;font-family:var(--mono);font-size:14px;color:var(--muted2);min-height:1.5em}
.ftr{background:var(--ink);color:var(--cream-muted);font-size:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
.ftr__in{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px}
.ftr a{color:var(--cream-muted)}
html[lang="en"] .l-es{display:none}
html[lang="es"] .l-en{display:none}
@media (max-width:860px){
  .err{grid-template-columns:1fr;gap:48px;padding-top:48px;padding-bottom:64px}
  .ticket{transform:none;max-width:320px}
}
@media (max-width:640px){
  .wrap{padding-left:20px;padding-right:20px}
  .logo__txt{font-size:21px}
  .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
