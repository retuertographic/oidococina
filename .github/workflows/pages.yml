name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/blissful-gauss-2poeoz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generar páginas desde src/ (plantillas + partials)
        run: python3 scripts/build_site.py
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html 404.html no-disponible.html sw.js robots.txt sitemap.xml site.webmanifest _site/
          cp -r assets _site/
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Modo mantenimiento (si existe el archivo MAINTENANCE)
        if: hashFiles('MAINTENANCE') != ''
        run: |
          # Toda la web muestra la página de no disponible hasta que se borre MAINTENANCE
          cp no-disponible.html _site/index.html
          cp no-disponible.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
